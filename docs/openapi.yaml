openapi: 3.0.3
info:
  title: TechStore RESTful API Specification
  description: >-
    Hợp đồng API (API Contract) chính thức giữa Front-End (HTML/CSS/JS) và Back-End (PHP thuần & MySQL).
    Thuộc Đồ án Topic 1: RESTful API · Các nhóm chức năng cốt lõi: Auth, Product, Cart, Order, Payments.
    Tuân thủ nghiêm ngặt nguyên lý REST, chuẩn mã trạng thái HTTP và cấu trúc response thống nhất.
  version: 1.0.0
  contact:
    name: TechStore Engineering Team
    email: admin@techstore.local

servers:
  - url: http://localhost:8000/api/v1
    description: Máy chủ cục bộ (Local Development Server)
  - url: /api/v1
    description: Production API Gateway

tags:
  - name: Auth
    description: Xác thực, đăng nhập JWT, đăng ký và quản lý phiên
  - name: Products
    description: Danh mục sản phẩm, bộ lọc, tìm kiếm, thông số và quản lý CRUD
  - name: Categories
    description: Ngành hàng sản phẩm
  - name: Brands
    description: Thương hiệu công nghệ
  - name: Cart
    description: Quản lý giỏ hàng mua sắm
  - name: Orders
    description: Quy trình đặt hàng, lịch sử đơn và cập nhật trạng thái
  - name: Payments
    description: Thanh toán chuyển khoản tự động VietQR (Napas247) và COD
  - name: Coupons
    description: Mã voucher ưu đãi giảm giá
  - name: Reviews
    description: Đánh giá và nhận xét sản phẩm
  - name: Wishlist
    description: Danh sách sản phẩm yêu thích
  - name: Recommendations
    description: Động cơ gợi ý sản phẩm tương tự (Cosine) và thường mua cùng (Apriori)
  - name: Admin
    description: Quản trị hệ thống, thống kê doanh thu và Audit Logs

paths:
  # ============================================================================
  # NHÓM 1: AUTH (XÁC THỰC & PHÂN QUYỀN JWT)
  # ============================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản khách hàng mới
      description: Tạo tài khoản mới, băm mật khẩu Bcrypt và cấp cặp Access Token + Refresh Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Thiếu thông tin hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email đã được sử dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập hệ thống, cấp Access & Refresh Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Cấp lại Access Token mới qua Refresh Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Cấp token mới thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      access_token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }
                      token_type: { type: string, example: "Bearer" }
                      expires_in: { type: integer, example: 3600 }
        '401':
          description: Refresh token không hợp lệ hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất và thu hồi Refresh Token
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Đăng xuất thành công, không trả nội dung (No Content)
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Lấy thông tin tài khoản đang đăng nhập
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin người dùng hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Không có quyền truy cập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google:
    post:
      tags: [Auth]
      summary: Đăng nhập qua OAuth 2.0 Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Google ID Token nhận được từ Google Sign-In SDK
      responses:
        '200':
          description: Đăng nhập Google thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # ============================================================================
  # NHÓM 2: PRODUCTS (SẢN PHẨM & TÌM KIẾM BỘ LỌC)
  # ============================================================================
  /products:
    get:
      tags: [Products]
      summary: Danh sách sản phẩm với bộ lọc, tìm kiếm, sắp xếp và phân trang
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Từ khóa tìm kiếm theo tên hoặc thông số
          example: "iPhone 16"
        - name: category_id
          in: query
          schema: { type: integer }
          description: Lọc theo mã danh mục
          example: 1
        - name: brand_id
          in: query
          schema: { type: integer }
          description: Lọc theo mã thương hiệu
          example: 1
        - name: min_price
          in: query
          schema: { type: number }
          description: Khoảng giá tối thiểu (VND)
          example: 10000000
        - name: max_price
          in: query
          schema: { type: number }
          description: Khoảng giá tối đa (VND)
          example: 35000000
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, price_asc, price_desc, rating_desc, newest]
            default: featured
          description: Tiêu chí sắp xếp danh sách
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: Số trang hiện tại
        - name: limit
          in: query
          schema: { type: integer, default: 12 }
          description: Số lượng sản phẩm mỗi trang
      responses:
        '200':
          description: Danh sách sản phẩm kèm dữ liệu phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags: [Products]
      summary: Thêm sản phẩm mới (Quyền Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Tạo sản phẩm thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Product'
                  message: { type: string, example: "Tạo sản phẩm thành công" }
        '403':
          description: Yêu cầu quyền Quản trị viên (Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      tags: [Products]
      summary: Chi tiết thông tin sản phẩm và thông số kỹ thuật
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: ID sản phẩm
      responses:
        '200':
          description: Thông tin chi tiết sản phẩm
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Không tìm thấy sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Products]
      summary: Cập nhật toàn bộ thông tin sản phẩm (Quyền Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Không tìm thấy sản phẩm

    patch:
      tags: [Products]
      summary: Cập nhật một phần thông tin sản phẩm (giá, tồn kho, nổi bật)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Cập nhật một phần thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Product'

    delete:
      tags: [Products]
      summary: Xóa sản phẩm khỏi hệ thống (Quyền Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Đã xóa sản phẩm thành công (No Content)
        '404':
          description: Không tìm thấy sản phẩm

  /categories:
    get:
      tags: [Categories]
      summary: Lấy danh sách danh mục sản phẩm
      responses:
        '200':
          description: Danh sách danh mục ngành hàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /brands:
    get:
      tags: [Brands]
      summary: Lấy danh sách thương hiệu công nghệ
      responses:
        '200':
          description: Danh sách hãng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'

  # ============================================================================
  # NHÓM 3: CART (GIỎ HÀNG KHÁCH HÀNG)
  # ============================================================================
  /cart:
    get:
      tags: [Cart]
      summary: Lấy thông tin giỏ hàng của người dùng hiện tại
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Chi tiết giỏ hàng và danh sách sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          description: Chưa xác thực tài khoản

  /cart/items:
    post:
      tags: [Cart]
      summary: Thêm sản phẩm vào giỏ hàng
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '201':
          description: Đã thêm sản phẩm vào giỏ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/CartItem'
                  message: { type: string, example: "Đã thêm vào giỏ hàng" }
        '400':
          description: Số lượng không hợp lệ hoặc vượt tồn kho

  /cart/items/{id}:
    put:
      tags: [Cart]
      summary: Cập nhật số lượng mặt hàng trong giỏ
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: ID mục giỏ hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Đã cập nhật số lượng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/CartItem'
        '404':
          description: Không tìm thấy mục trong giỏ

    delete:
      tags: [Cart]
      summary: Xóa sản phẩm khỏi giỏ hàng
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Đã xóa sản phẩm khỏi giỏ hàng thành công
        '404':
          description: Không tìm thấy mục cần xóa

  # ============================================================================
  # NHÓM 4: ORDERS (ĐẶT HÀNG & QUẢN LÝ TIẾN ĐỘ ĐƠN HÀNG)
  # ============================================================================
  /orders:
    get:
      tags: [Orders]
      summary: Lấy lịch sử danh sách đơn hàng của người dùng hiện tại
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách đơn hàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

    post:
      tags: [Orders]
      summary: Tạo đơn hàng mới từ giỏ hàng (Checkout)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Đặt hàng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
                  message: { type: string, example: "Đặt hàng thành công" }
        '400':
          description: Giỏ hàng trống hoặc thông tin đặt hàng thiếu

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Lấy thông tin chi tiết của một đơn hàng
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Chi tiết đơn hàng kèm danh sách sản phẩm và thanh toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: Không tìm thấy đơn hàng

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Hủy đơn hàng (Khi đơn đang ở trạng thái pending hoặc confirmed)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Đã hủy đơn hàng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Đã hủy đơn hàng thành công" }
        '400':
          description: Đơn hàng đã được giao hoặc đã hoàn tất, không thể hủy

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Cập nhật trạng thái đơn hàng và trạng thái thanh toán (Quyền Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Đã cập nhật trạng thái đơn hàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
                  message: { type: string, example: "Cập nhật trạng thái thành công" }

  # ============================================================================
  # NHÓM BỔ TRỢ: PAYMENTS, COUPONS & RECOMMENDATIONS
  # ============================================================================
  /payments/qr:
    post:
      tags: [Payments]
      summary: Khởi tạo mã VietQR chuẩn NAPAS247 cho đơn hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VietQrInitRequest'
      responses:
        '201':
          description: Sinh mã QR VietQR thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VietQrResponse'

  /payments/{orderId}/status:
    get:
      tags: [Payments]
      summary: Kiểm tra trạng thái thanh toán đơn hàng (Polling realtime)
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Trạng thái thanh toán hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      order_id: { type: integer, example: 1001 }
                      payment_status: { type: string, enum: [pending, paid, failed], example: "paid" }
                      paid_at: { type: string, format: date-time, example: "2026-10-21 08:35:00" }

  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Kiểm tra và tính toán giảm giá của voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponValidateRequest'
      responses:
        '200':
          description: Mã giảm giá hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponValidateResponse'
        '400':
          description: Chưa đạt điều kiện áp dụng voucher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Mã không tồn tại hoặc đã hết hạn

  /products/{id}/recommendations:
    get:
      tags: [Recommendations]
      summary: Lấy danh sách sản phẩm tương tự (Cosine) và thường mua cùng (Apriori)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Danh sách gợi ý thông minh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      similar_products:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                      frequently_bought_together:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'

  /recommendations/me:
    get:
      tags: [Recommendations]
      summary: Gợi ý sản phẩm cá nhân hóa theo lịch sử xem và giỏ hàng của tôi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách sản phẩm được AI đề xuất riêng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

# ==============================================================================
# COMPONENTS SCHEMAS (ĐỊNH NGHĨA KIỂU DỮ LIỆU CHUẨN)
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập JWT Access Token vào định dạng "Bearer {token}"

  schemas:
    # 1. Base Responses
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Thao tác thành công" }
        data: { type: object }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: "VALIDATION_ERROR" }
            message: { type: string, example: "Dữ liệu gửi lên không hợp lệ" }
            details:
              type: array
              items: { type: string }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page: { type: integer, example: 12 }
        total_items: { type: integer, example: 42 }
        total_pages: { type: integer, example: 4 }

    # 2. Auth Schemas
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        name: { type: string, example: "Nguyễn Văn A" }
        email: { type: string, format: email, example: "khachhang@gmail.com" }
        password: { type: string, format: password, example: "MatKhau@123" }
        phone: { type: string, example: "0987654321" }
        address: { type: string, example: "227 Nguyễn Văn Cừ, Quận 5, TP.HCM" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "user@techstore.local" }
        password: { type: string, format: password, example: "User@123" }

    TokenRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, example: "b556b34819311e8c306d3756deeb3ea7..." }

    User:
      type: object
      properties:
        id: { type: integer, example: 2 }
        name: { type: string, example: "Tuấn Kiệt" }
        email: { type: string, format: email, example: "user@techstore.local" }
        role: { type: string, enum: [admin, customer], example: "customer" }
        phone: { type: string, example: "0987654321" }
        address: { type: string, example: "123 Cách Mạng Tháng 8, Quận 10, TP.HCM" }
        avatar: { type: string, example: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=200" }
        status: { type: string, enum: [active, inactive, banned], example: "active" }
        created_at: { type: string, format: date-time, example: "2026-02-15 09:30:00" }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            access_token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }
            refresh_token: { type: string, example: "b556b34819311e8c306d3756deeb3ea7..." }
            token_type: { type: string, example: "Bearer" }
            expires_in: { type: integer, example: 3600 }

    # 3. Product Schemas
    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "iPhone 16 Pro Max 256GB" }
        slug: { type: string, example: "iphone-16-pro-max-256gb" }
        category_id: { type: integer, example: 1 }
        category_name: { type: string, example: "Điện thoại" }
        brand_id: { type: integer, example: 1 }
        brand_name: { type: string, example: "Apple" }
        price: { type: number, example: 34990000 }
        original_price: { type: number, example: 37990000 }
        stock: { type: integer, example: 25 }
        rating: { type: number, example: 4.95 }
        review_count: { type: integer, example: 142 }
        view_count: { type: integer, example: 1850 }
        image: { type: string, example: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600" }
        ram: { type: string, example: "8GB" }
        rom: { type: string, example: "256GB" }
        chipset: { type: string, example: "Apple A18 Pro 3nm" }
        featured: { type: integer, enum: [0, 1], example: 1 }

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            description: { type: string, example: "iPhone 16 Pro Max thiết kế Titan sa mạc..." }
            images:
              type: array
              items: { type: string }
            screen: { type: string, example: "6.9 inch Super Retina XDR OLED 120Hz" }
            battery: { type: string, example: "4685 mAh, Sạc nhanh 30W" }
            camera: { type: string, example: "Chính 48MP + Góc rộng 48MP + Tele 5x 12MP" }
            specs:
              type: array
              items:
                type: object
                properties:
                  spec_group: { type: string, example: "Hiệu năng" }
                  spec_key: { type: string, example: "Vi xử lý (CPU/Chip)" }
                  spec_value: { type: string, example: "Apple A18 Pro 3nm" }

    ProductCreateRequest:
      type: object
      required: [name, category_id, brand_id, price, stock]
      properties:
        name: { type: string, example: "iPhone 16 Pro Max 256GB" }
        category_id: { type: integer, example: 1 }
        brand_id: { type: integer, example: 1 }
        price: { type: number, example: 34990000 }
        original_price: { type: number, example: 37990000 }
        stock: { type: integer, example: 25 }
        image: { type: string, example: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600" }
        images:
          type: array
          items: { type: string }
        ram: { type: string, example: "8GB" }
        rom: { type: string, example: "256GB" }
        chipset: { type: string, example: "Apple A18 Pro" }
        screen: { type: string, example: "6.9 inch Super Retina XDR" }
        battery: { type: string, example: "4685 mAh" }
        camera: { type: string, example: "48MP + 48MP + 12MP" }
        description: { type: string, example: "Mô tả sản phẩm" }
        featured: { type: integer, enum: [0, 1], example: 1 }

    ProductUpdateRequest:
      type: object
      properties:
        price: { type: number, example: 33990000 }
        stock: { type: integer, example: 30 }
        featured: { type: integer, enum: [0, 1], example: 1 }
        status: { type: string, enum: [active, inactive, out_of_stock], example: "active" }

    Category:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Điện thoại" }
        slug: { type: string, example: "dien-thoai" }
        icon: { type: string, example: "📱" }
        product_count: { type: integer, example: 10 }

    Brand:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Apple" }
        slug: { type: string, example: "apple" }
        logo: { type: string, example: "" }

    # 4. Cart Schemas
    CartItem:
      type: object
      properties:
        id: { type: integer, example: 1 }
        user_id: { type: integer, example: 2 }
        product_id: { type: integer, example: 1 }
        product_name: { type: string, example: "iPhone 16 Pro Max 256GB" }
        price: { type: number, example: 34990000 }
        quantity: { type: integer, example: 1 }
        variant: { type: string, example: "256GB - Titan Sa Mạc" }
        image: { type: string, example: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600" }

    CartResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CartItem'
            total_items: { type: integer, example: 2 }
            subtotal: { type: number, example: 35880000 }

    AddToCartRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, example: 1 }
        quantity: { type: integer, default: 1, example: 1 }
        variant: { type: string, example: "256GB - Titan Sa Mạc" }

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, example: 2 }

    # 5. Order Schemas
    OrderItem:
      type: object
      properties:
        id: { type: integer, example: 1 }
        order_id: { type: integer, example: 1001 }
        product_id: { type: integer, example: 1 }
        product_name: { type: string, example: "iPhone 16 Pro Max 256GB" }
        price: { type: number, example: 34990000 }
        quantity: { type: integer, example: 1 }
        variant: { type: string, example: "256GB - Titan Sa Mạc" }
        image: { type: string, example: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600" }

    Order:
      type: object
      properties:
        id: { type: integer, example: 1001 }
        order_code: { type: string, example: "TS-749201" }
        user_id: { type: integer, example: 2 }
        customer_name: { type: string, example: "Tuấn Kiệt" }
        customer_phone: { type: string, example: "0987654321" }
        customer_email: { type: string, example: "user@techstore.local" }
        shipping_address: { type: string, example: "123 Cách Mạng Tháng 8, Q10, TP.HCM" }
        payment_method: { type: string, enum: [vietqr, cod, bank_transfer], example: "vietqr" }
        payment_status: { type: string, enum: [pending, paid, failed], example: "paid" }
        status: { type: string, enum: [pending, confirmed, shipping, completed, cancelled], example: "completed" }
        subtotal: { type: number, example: 41370000 }
        discount_amount: { type: number, example: 500000 }
        shipping_fee: { type: number, example: 0 }
        total_amount: { type: number, example: 40870000 }
        coupon_code: { type: string, example: "TECH10" }
        note: { type: string, example: "Giao giờ hành chính" }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at: { type: string, format: date-time, example: "2026-08-05 09:30:00" }

    CreateOrderRequest:
      type: object
      required: [customer_name, customer_phone, shipping_address, payment_method]
      properties:
        customer_name: { type: string, example: "Tuấn Kiệt" }
        customer_phone: { type: string, example: "0987654321" }
        customer_email: { type: string, format: email, example: "user@techstore.local" }
        shipping_address: { type: string, example: "123 Cách Mạng Tháng 8, Quận 10, TP.HCM" }
        payment_method: { type: string, enum: [vietqr, cod, bank_transfer], example: "vietqr" }
        coupon_code: { type: string, example: "TECH10" }
        note: { type: string, example: "Gọi trước khi giao hàng" }

    UpdateOrderStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, shipping, completed, cancelled]
          example: "shipping"
        payment_status:
          type: string
          enum: [pending, paid, failed]
          example: "paid"

    # 6. Payment & VietQR Schemas
    VietQrInitRequest:
      type: object
      required: [order_id, amount]
      properties:
        order_id: { type: integer, example: 1001 }
        amount: { type: number, example: 40870000 }
        order_code: { type: string, example: "TS-749201" }

    VietQrResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            order_id: { type: integer, example: 1001 }
            order_code: { type: string, example: "TS-749201" }
            amount: { type: number, example: 40870000 }
            qr_image_url: { type: string, example: "https://api.vietqr.io/image/970422-0123456789-compact2.png?amount=40870000&addInfo=TS-749201" }
            bank_id: { type: string, example: "MB" }
            account_no: { type: string, example: "0123456789" }
            account_name: { type: string, example: "TECHSTORE" }
            transfer_content: { type: string, example: "TS-749201" }

    # 7. Coupon Schemas
    CouponValidateRequest:
      type: object
      required: [code, total]
      properties:
        code: { type: string, example: "TECH10" }
        total: { type: number, example: 34990000 }

    CouponValidateResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            code: { type: string, example: "TECH10" }
            discount_type: { type: string, example: "percent" }
            discount_amount: { type: number, example: 500000 }
            new_total: { type: number, example: 34490000 }
