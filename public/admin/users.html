            <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        TechStore <span>ADMIN</span>

      <div class="sidebar-menu">
        <div class="menu-label">Tổng Quan</div>
        <a href="/admin/index.html" class="sidebar-link">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="5" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="11" width="8" height="10" rx="2" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="8" height="7" rx="2" stroke="currentColor" stroke-width="2"/></svg>

        <div class="menu-label">Quản Lý Bán Hàng</div>
        <a href="/admin/products.html" class="sidebar-link">

          <span>Sản phẩm</span>
        </a>
        <a href="/admin/orders.html" class="sidebar-link">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 4.8v8.4l-9 4.8-9-4.8V7.8L12 3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 3v9.6M21 7.8l-9 4.8M3 7.8l9 4.8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Đơn hàng & VietQR</span>
        </a>
        <a href="/admin/coupons.html" class="sidebar-link">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><path d="M3 8a3 3 0 013-3h12a3 3 0 013 3v2a2 2 0 000 4v2a3 3 0 01-3 3H6a3 3 0 01-3-3v-2a2 2 0 000-4V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12h.01M15 12h.01M12 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Mã giảm giá</span>
        </a>

        <div class="menu-label">Hệ Thống</div>

          <span>Người dùng</span>
        </a>
        <a href="/docs/index.html" target="_blank" class="sidebar-link" style="color: #a78bfa;">

          <span>Swagger & Redoc API (37)</span>
        </a>
        <a href="/pages/index.html" class="sidebar-link" style="color: #38bdf8;">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Xem Website Khách</span>

    </aside>

    <!-- Main Content -->
    <div class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="btn-sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle Menu" style="background:none; border:none; cursor:pointer;">
            <svg class="tech-icon tech-icon-md" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <div style="font-weight: 700; font-size: 16px;">Quản Lý Người Dùng & Phân Quyền</div>
        </div>
      </header>

      <main class="admin-content-area">
        <div class="admin-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Họ và tên</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Trạng thái</th>
                  <th>Ngày đăng ký</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/icons.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    let usersList = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!api.isAdmin()) {
        showToast('Vui lòng đăng nhập quyền Admin!', 'danger');
        setTimeout(() => window.location.href = '/pages/login.html', 800);
        return;
      }
      loadUsers();
    });

    function toggleSidebar() {
      document.getElementById('admin-sidebar').classList.toggle('open');
    }

    async function loadUsers() {
      const res = await api.admin.getUsers();
      usersList = res.data || [];
      renderUsersTable(usersList);
    }

    function renderUsersTable(users) {
      const tbody = document.getElementById('users-tbody');
      tbody.innerHTML = users.map(u => {
        const lockIcon = u.status === 'active' 
          ? `${TechIcons.render('lock', { size: 14 })} <span>Khóa</span>` 
          : `${TechIcons.render('unlock', { size: 14 })} <span>Mở khóa</span>`;

        return `
        <tr>
          <td><strong>#${u.id}</strong></td>
          <td><strong>${(u.name || "").replace(/Tu\?+n\s*Ki\?+t/gi, "Tuấn Kiệt").replace(/H\?+u\s*Nam/gi, "Hữu Nam").replace(/Th\?+nh\s*Trung/gi, "Thành Trung")}</strong></td>
          <td>${u.email}</td>
          <td>
            <span class="badge-discount" style="background: ${u.role === 'admin' ? '#d70018' : '#2563eb'};">
              ${u.role === 'admin' ? 'Super Admin' : 'Khách hàng'}
            </span>
          </td>
          <td>
            <span class="status-pill ${u.status === 'active' ? 'status-completed' : 'status-cancelled'}">
              ${u.status === 'active' ? 'Hoạt động' : 'Đã khóa'}
            </span>
          </td>
          <td>${u.created_at}</td>
          <td>
            <div style="display: flex; gap: 6px;">
              <button class="btn btn-outline btn-sm" onclick="toggleUserStatus(${u.id})" style="display: inline-flex; align-items: center; gap: 4px;">
                ${lockIcon}
              </button>
              <button class="btn btn-outline btn-sm" onclick="toggleUserRole(${u.id})">
                ${u.role === 'admin' ? 'Hạ quyền' : 'Thăng Admin'}
              </button>
            </div>
          </td>
        </tr>
      `}).join('');
    }

    async function toggleUserStatus(userId) {
      const u = usersList.find(x => x.id === userId);
      if (u) {
        u.status = u.status === 'active' ? 'locked' : 'active';
        await api.admin.updateUser(userId, { status: u.status });
        showToast(`Đã đổi trạng thái tài khoản #${userId}`, 'info');
        renderUsersTable(usersList);
      }
    }

    async function toggleUserRole(userId) {
      const u = usersList.find(x => x.id === userId);
      if (u) {
        u.role = u.role === 'admin' ? 'customer' : 'admin';
        await api.admin.updateUser(userId, { role: u.role });
        showToast(`Đã thay đổi vai trò tài khoản #${userId} thành ${u.role}`, 'success');
        renderUsersTable(usersList);
      }
    }
  </script>
</body>
</html>
