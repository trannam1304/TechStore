<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-brand">
        <span class="logo-mark-wrap" style="width: 28px; height: 28px;">
          <svg class="tech-icon tech-icon-md" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#d70018"/>
            <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        TechStore <span>ADMIN</span>
      </div>

      <div class="sidebar-menu">
        <div class="menu-label">Tổng Quan</div>
        <a href="/admin/index.html" class="sidebar-link">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="5" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="11" width="8" height="10" rx="2" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="8" height="7" rx="2" stroke="currentColor" stroke-width="2"/></svg>
          <span>Dashboard</span>
        </a>

        <div class="menu-label">Quản Lý Bán Hàng</div>
        <a href="/admin/products.html" class="sidebar-link">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Sản phẩm</span>
        </a>
        <a href="/admin/orders.html" class="sidebar-link">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 4.8v8.4l-9 4.8-9-4.8V7.8L12 3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 3v9.6M21 7.8l-9 4.8M3 7.8l9 4.8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Đơn hàng & VietQR</span>
        </a>
        <a href="/admin/coupons.html" class="sidebar-link active">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><path d="M3 8a3 3 0 013-3h12a3 3 0 013 3v2a2 2 0 000 4v2a3 3 0 01-3 3H6a3 3 0 01-3-3v-2a2 2 0 000-4V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12h.01M15 12h.01M12 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Mã giảm giá</span>
        </a>

        <div class="menu-label">Hệ Thống</div>
        <a href="/admin/users.html" class="sidebar-link">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 3.13a4 4 0 010 7.75M21 21v-2a4 4 0 00-3-3.85" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Người dùng</span>
        </a>
        <a href="/docs/index.html" target="_blank" class="sidebar-link" style="color: #a78bfa;">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M8 10l-2 2 2 2M16 10l2 2-2 2M13 9l-2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Swagger & Redoc API (37)</span>
        </a>
        <a href="/pages/index.html" class="sidebar-link" style="color: #38bdf8;">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Xem Website Khách</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="btn-sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle Menu" style="background:none; border:none; cursor:pointer;">
            <svg class="tech-icon tech-icon-md" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <div style="font-weight: 700; font-size: 16px;">Quản Lý Mã Giảm Giá (Coupons)</div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" onclick="openCouponModal()" style="display: inline-flex; align-items: center; gap: 6px;">
            <svg class="tech-icon tech-icon-xs" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <span>Tạo mã giảm giá mới</span>
          </button>
        </div>
      </header>

      <main class="admin-content-area">
        <div class="admin-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Mã Coupon</th>
                  <th>Mô tả</th>
                  <th>Loại</th>
                  <th>Giá trị giảm</th>
                  <th>Đơn tối thiểu</th>
                  <th>Trạng thái</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="coupons-tbody">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: Add Coupon -->
  <div class="modal-backdrop" id="coupon-modal">
    <div class="modal-dialog" style="max-width: 500px;">
      <div class="modal-header">
        <h3 class="modal-title">Tạo Mã Giảm Giá Mới</h3>
        <button class="modal-close" onclick="closeCouponModal()" aria-label="Đóng" style="display: flex; align-items: center; justify-content: center;">
          <svg class="tech-icon tech-icon-sm" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="coupon-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Mã code (Viết hoa, liền nhau) *</label>
            <input type="text" id="coup-code" class="form-control" required style="text-transform: uppercase;" placeholder="SALE50">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Loại giảm *</label>
              <select id="coup-type" class="form-select">
                <option value="amount">Số tiền cố định (VNĐ)</option>
                <option value="percent">Phần trăm (%)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Giá trị giảm *</label>
              <input type="number" id="coup-value" class="form-control" required min="1" placeholder="50000">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Đơn hàng tối thiểu (VNĐ) *</label>
            <input type="number" id="coup-min-order" class="form-control" required min="0" value="500000">
          </div>
          <div class="form-group">
            <label class="form-label">Mô tả hiển thị</label>
            <input type="text" id="coup-desc" class="form-control" placeholder="Giảm 50k cho đơn từ 500k">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeCouponModal()">Hủy</button>
          <button type="submit" class="btn btn-primary">Tạo mã</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/icons.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    let couponsList = [...DEFAULT_COUPONS];

    document.addEventListener('DOMContentLoaded', () => {
      if (!api.isAdmin()) {
        showToast('Vui lòng đăng nhập quyền Admin!', 'danger');
        setTimeout(() => window.location.href = '/pages/login.html', 800);
        return;
      }
      renderCouponsTable();
      document.getElementById('coupon-form').addEventListener('submit', handleAddCoupon);
    });

    function toggleSidebar() {
      document.getElementById('admin-sidebar').classList.toggle('open');
    }

    function renderCouponsTable() {
      const tbody = document.getElementById('coupons-tbody');
      tbody.innerHTML = couponsList.map(c => `
        <tr>
          <td><strong style="color: var(--color-primary); font-size: 15px;">${c.code}</strong></td>
          <td>${c.description}</td>
          <td>${c.discount_type === 'percent' ? 'Phần trăm (%)' : 'Số tiền cố định'}</td>
          <td style="font-weight: 700;">${c.discount_type === 'percent' ? c.value + '%' : formatVND(c.value)}</td>
          <td>${formatVND(c.min_order)}</td>
          <td><span class="status-pill status-completed">Đang hoạt động</span></td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="deleteCoupon('${c.code}')" style="color: var(--color-danger); display: inline-flex; align-items: center; gap: 4px;">
              ${TechIcons.render('trash', { size: 14 })}
              <span>Xóa</span>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function openCouponModal() {
      document.getElementById('coupon-form').reset();
      document.getElementById('coupon-modal').classList.add('active');
    }

    function closeCouponModal() {
      document.getElementById('coupon-modal').classList.remove('active');
    }

    function handleAddCoupon(e) {
      e.preventDefault();
      const newCoupon = {
        code: document.getElementById('coup-code').value.trim().toUpperCase(),
        discount_type: document.getElementById('coup-type').value,
        value: parseInt(document.getElementById('coup-value').value, 10),
        min_order: parseInt(document.getElementById('coup-min-order').value, 10),
        description: document.getElementById('coup-desc').value.trim()
      };
      couponsList.unshift(newCoupon);
      showToast(`Đã tạo mã giảm giá ${newCoupon.code}!`, 'success');
      closeCouponModal();
      renderCouponsTable();
    }

    function deleteCoupon(code) {
      if (confirm(`Bạn có chắc chắn muốn xóa coupon ${code}?`)) {
        couponsList = couponsList.filter(c => c.code !== code);
        showToast(`Đã xóa coupon ${code}`, 'info');
        renderCouponsTable();
      }
    }
  </script>
</body>
</html>
